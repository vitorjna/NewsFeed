# Configuration for News Feed Application

# Telegram Bot Token
telegram_bot_token: "YOUR_TELEGRAM_BOT_TOKEN"

# LLM Configuration (supports local providers like LM Studio/Ollama)
llm:
  api_key: "not-needed-for-local" # Use your API key or a placeholder for local
  base_url: "http://localhost:1234/v1" # LM Studio default: http://localhost:1234/v1 | Ollama: http://localhost:11434/v1
  model: "local-model" # The name of the model loaded in your provider

# Global Settings
fetch_interval_minutes: 15
database_path: "data/seen_urls.db"

# Themes and Channels
# Each theme has a target Telegram channel ID and a list of RSS feeds.
themes:
  - name: "Breaking News"
    channel_id: "-1001234567890" # Example Channel ID
    feeds:
      - "http://feeds.bbci.co.uk/news/world/rss.xml"
      - "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    prompt_focus: "breaking news, major world events, high urgency"

  - name: "Science"
    channel_id: "-1000987654321"
    feeds:
      - "https://www.sciencedaily.com/rss/top/science.xml"
      - "https://rss.nytimes.com/services/xml/rss/nyt/Science.xml"
    prompt_focus: "scientific discoveries, research, space, technology"

  - name: "Tech"
    channel_id: "-1001122334455"
    feeds:
      - "https://feeds.feedburner.com/TechCrunch/"
      - "https://www.theverge.com/rss/index.xml"
    prompt_focus: "new technology, software, hardware, startups"
