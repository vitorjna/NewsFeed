<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    text {
      font-family: Tahoma, Verdana, Helvetica, sans-serif;
      alignment-baseline: central;
      text-anchor: middle;
    }
    :not(g) > text, :not(g) > circle, g {
      filter: url(#drop-shadow);
    }
  </style>

  <!-- BACKGROUND COLOR -->
  <rect x="0" y="0" width="512" height="512" fill="#0055FF"/>

  <!-- BORDER: Crisp white circle -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FFFFFF" stroke-width="12"/>

  <!-- MASCOT: The News Bear -->
  <g fill="#FFFFFF">
    <!-- Bear Ears -->
    <circle cx="202" cy="80" r="20" />
    <circle cx="310" cy="80" r="20" />

    <!-- Inner Ear Details -->
    <circle cx="202" cy="80" r="8" fill="#333" />
    <circle cx="310" cy="80" r="8" fill="#333" />

    <!-- Bear Head -->
    <circle cx="256" cy="119" r="62" />

    <!-- FPV Goggles Straps -->
    <rect x="190" y="98" width="14" height="12" fill="#333" />
    <rect x="308" y="98" width="14" height="12" fill="#333" />

    <!-- FPV Goggles Base & Details -->
    <rect x="200" y="84" width="112" height="40" rx="16" fill="#333" />
    <rect x="210" y="92" width="92" height="24" rx="8" fill="#111" />
    <rect x="216" y="96" width="36" height="4" rx="2" fill="#444" />
    <rect x="260" y="96" width="36" height="4" rx="2" fill="#444" />

    <!-- Bear Snout & Nose -->
    <ellipse cx="256" cy="136" rx="26" ry="18" fill="#333" />
    <ellipse cx="256" cy="130" rx="9" ry="5" fill="#FFFFFF" />

    <!-- 3D Angled FPV Controller -->
    <!-- Remote Top Face (Main Surface angled towards the bear) -->
     <polygon points="200,185 312,185 340,250 172,250" fill="#EEE" stroke="#333" stroke-width="5" />

    <!-- Remote Front Face (Thickness for Depth) -->
     <polygon points="172,230 330,230 330,250 172,250" fill="#EEE" stroke="#333" stroke-width="5" />

    <!-- Telemetry Screen (Trapezoid for perspective) -->
    <polygon points="226,198 286,198 294,218 218,218" fill="#111" stroke="#333" stroke-width="3" />
    <path d="M 226 210 L 235 203 L 245 215 L 255 200 L 265 215 L 275 205 L 285 212" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linejoin="round"/>

    <!-- Controller Antenna -->
    <line x1="256" y1="220" x2="256" y2="240" fill="#333" stroke="#333" stroke-width="12" stroke-linejoin="round"/>

    <!-- Controller Joysticks (Angled) -->
    <!-- Left Stick Base -->
    <ellipse cx="205" cy="215" rx="10" ry="6" fill="#333" />
    <!-- Left Stick Shaft & Knob -->
    <line x1="205" y1="215" x2="192" y2="195" stroke="#CCC" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="192" cy="195" rx="7" ry="4" fill="#E63946" stroke="#333" stroke-width="2" />

    <!-- Right Stick Base -->
    <ellipse cx="307" cy="215" rx="10" ry="6" fill="#333" />
    <!-- Right Stick Shaft & Knob -->
    <line x1="307" y1="215" x2="320" y2="195" stroke="#CCC" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="320" cy="195" rx="7" ry="4" fill="#E63946" stroke="#333" stroke-width="2" />

    <!-- Bear Paws -->
    <circle cx="170" cy="235" r="18" fill="#FFFFFF" stroke="#333" stroke-width="5" />
    <circle cx="342" cy="235" r="18" fill="#FFFFFF" stroke="#333" stroke-width="5" />

    <!-- RIGHT: Hovering FPV Drone -->
    <g transform="translate(5, -60) rotate(12)" >
      <!-- Carbon Fiber Frame (X-Shape) -->
      <path d="M 410 115 L 385 95" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
      <path d="M 410 115 L 435 95" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
      <path d="M 410 115 L 380 135" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
      <path d="M 410 115 L 440 135" stroke="#222222" stroke-width="5" stroke-linecap="round"/>

      <!-- Motors -->
      <rect x="381" y="88" width="8" height="10" rx="2" fill="#E63946" stroke="#111111" stroke-width="2"/>
      <rect x="431" y="88" width="8" height="10" rx="2" fill="#E63946" stroke="#111111" stroke-width="2"/>
      <rect x="376" y="128" width="8" height="10" rx="2" fill="#E63946" stroke="#111111" stroke-width="2"/>
      <rect x="436" y="128" width="8" height="10" rx="2" fill="#E63946" stroke="#111111" stroke-width="2"/>

      <!-- Center Body & Top Battery -->
      <polygon points="400,100 420,100 425,120 395,120" fill="#111111" />

      <!-- Back Propellers -->
      <ellipse cx="385" cy="95" rx="20" ry="6" fill="#00FFCC" opacity="0.5" />
      <ellipse cx="435" cy="95" rx="20" ry="6" fill="#00FFCC" opacity="0.5" />

      <!-- Front Propellers -->
      <ellipse cx="380" cy="135" rx="22" ry="7" fill="#00FFCC" opacity="0.6" />
      <circle cx="380" cy="135" r="2" fill="#FFFFFF" />

      <ellipse cx="440" cy="135" rx="22" ry="7" fill="#00FFCC" opacity="0.6" />
      <circle cx="440" cy="135" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- CATEGORY -->
  <text x="256" y="320" font-weight="1000" font-size="100" fill="#FFFFFF" letter-spacing="8">TECH</text>

  <!-- NETWORK BADGE: "NB" for News Bear -->
  <g>
    <circle cx="256" cy="432" r="42" fill="#FFFFFF"/>
    <text x="255" y="432" font-weight="1000" font-size="48" fill="#333" letter-spacing="2">NB</text>
  </g>

  <!-- FOR TESTING, to toggle change style for display -->
  <g style="display: none; stroke: black;">
    <line x1="0" y1="0" x2="512" y2="512"/> // TL BR
    <line x1="0" y1="512" x2="512" y2="0"/> // TR BL
    <line x1="0" y1="64" x2="512" y2="64"/> // HOR 0.5
    <line x1="0" y1="128" x2="512" y2="128"/> // HOR 1
    <line x1="0" y1="192" x2="512" y2="192"/> // HOR 1.5
    <line x1="0" y1="256" x2="512" y2="256"/> // HOR 2
    <line x1="0" y1="320" x2="512" y2="320"/> // HOR 2.5
    <line x1="0" y1="384" x2="512" y2="384"/> // HOR 3
    <line x1="0" y1="448" x2="512" y2="448"/> // HOR 3.5
    <line x1="128" y1="0" x2="128" y2="512"/> // VER 1
    <line x1="256" y1="0" x2="256" y2="512"/> // VER 2
    <line x1="384" y1="0" x2="384" y2="512"/> // VER 3
  </g>

</svg>