<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    text {
      font-family: Tahoma, Verdana, Helvetica, sans-serif;
      alignment-baseline: central;
      text-anchor: middle;
    }
    :not(g) > text, :not(g) > circle, g {
      filter: url(#drop-shadow);
    }
  </style>

  <!-- BACKGROUND COLOR -->
  <rect x="0" y="0" width="512" height="512" fill="#D32F2F"/>

  <!-- BORDER: Crisp white circle -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FFFFFF" stroke-width="12"/>

  <!-- MASCOT: The News Bear -->
  <g fill="#FFFFFF">
    <!-- Bear Ears -->
    <circle cx="202" cy="80" r="20" />
    <circle cx="310" cy="80" r="20" />

    <!-- Inner Ear Details -->
    <circle cx="202" cy="80" r="8" fill="#333" />
    <circle cx="310" cy="80" r="8" fill="#333" />

    <!-- Bear Head -->
    <circle cx="256" cy="119" r="62" />

    <!-- Bear Eyes -->
    <circle cx="232" cy="106" r="5" fill="#333" />
    <circle cx="280" cy="106" r="5" fill="#333" />

    <!-- Bear Snout & Nose -->
    <ellipse cx="256" cy="136" rx="26" ry="18" fill="#333" />
    <ellipse cx="256" cy="130" rx="9" ry="5" fill="#FFFFFF" />

    <!-- Newspaper Base -->
    <rect x="164" y="164" width="184" height="96" rx="5" fill="#FFFFFF" stroke="#333" stroke-width="6" />

    <!-- Newspaper Center Fold -->
    <line x1="256" y1="164" x2="256" y2="260" stroke="#333" stroke-width="5" />

    <!-- Newspaper Text Lines (Left Page) -->
    <line x1="180" y1="190" x2="240" y2="190" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <line x1="180" y1="216" x2="240" y2="216" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <line x1="180" y1="242" x2="216" y2="242" stroke="#333" stroke-width="5" stroke-linecap="round" />

    <!-- Newspaper Text Lines (Right Page) -->
    <line x1="272" y1="190" x2="332" y2="190" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <line x1="272" y1="216" x2="332" y2="216" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <line x1="272" y1="242" x2="306" y2="242" stroke="#333" stroke-width="5" stroke-linecap="round" />

    <!-- Bear Paws -->
    <circle cx="157" cy="216" r="18" fill="#FFFFFF" stroke="#333" stroke-width="5" />
    <circle cx="354" cy="242" r="18" fill="#FFFFFF" stroke="#333" stroke-width="5" />
  </g>

  <!-- CATEGORY -->
  <text x="256" y="320" font-weight="1000" font-size="100" fill="#FFFFFF" letter-spacing="8">WORLD</text>

  <!-- NETWORK BADGE: "NB" for News Bear -->
  <g>
    <circle cx="256" cy="432" r="42" fill="#FFFFFF"/>
    <text x="255" y="432" font-weight="1000" font-size="48" fill="#333" letter-spacing="2">NB</text>
  </g>

  <!-- FOR TESTING, to toggle change style for display -->
  <g style="display: none; stroke: black;">
    <line x1="0" y1="0" x2="512" y2="512"/> // TL BR
    <line x1="0" y1="512" x2="512" y2="0"/> // TR BL
    <line x1="0" y1="64" x2="512" y2="64"/> // HOR 0.5
    <line x1="0" y1="128" x2="512" y2="128"/> // HOR 1
    <line x1="0" y1="192" x2="512" y2="192"/> // HOR 1.5
    <line x1="0" y1="256" x2="512" y2="256"/> // HOR 2
    <line x1="0" y1="320" x2="512" y2="320"/> // HOR 2.5
    <line x1="0" y1="384" x2="512" y2="384"/> // HOR 3
    <line x1="0" y1="448" x2="512" y2="448"/> // HOR 3.5
    <line x1="128" y1="0" x2="128" y2="512"/> // VER 1
    <line x1="256" y1="0" x2="256" y2="512"/> // VER 2
    <line x1="384" y1="0" x2="384" y2="512"/> // VER 3
  </g>

</svg>