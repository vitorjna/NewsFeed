services:
  newsfeed:
    image: python:3.14-slim
    container_name: newsfeed_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: sh entrypoint.sh
    labels:
      - "autoheal=true"
    healthcheck:
      # The heartbeat file is written every 5m by the app.
      # We allow up to 30 minutes (1800s) before treating it as stale,
      # to give headroom during the initial startup and long fetch cycles.
      test: >
        sh -c "test -f /tmp/newsfeed_heartbeat &&
               [ $(( $(date +%s) - $(cat /tmp/newsfeed_heartbeat | cut -d. -f1) )) -lt 1800 ]"
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 1800s

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
